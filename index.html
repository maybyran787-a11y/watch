<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="only light">
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="两个时区，同一部剧。给 Maria 的一份共同片单。">
<title>一起追剧 · для Марии</title>
<style>html{color-scheme:only light;background:#fff}html,body{background:#fff!important}</style>
<style>/* styles.css — 奶油纸 + 贴纸手作感：粗描边、硬投影、彩色小兽 */
:root{
  color-scheme:only light;
  --ink:#2b2430;
  --paper:#ffffff; --cream:#ffffff;
  --tomato:#ff6f5e; --mustard:#ffcb45; --mint:#5ecfb4; --sky:#7cc7ff; --lilac:#bfa8ff; --pink:#ffb3c8;
  --muted:#6f5c65; --faint:#8d7a83;
  --line:2.5px solid var(--ink);
  --serif:'Noto Serif SC','Songti SC','Source Han Serif SC','STSong',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
  --sh:4px 4px 0 var(--ink);
  --sh-s:3px 3px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{background:#fff !important}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;
  line-height:1.6;font-size:15px;overflow-x:hidden;color-scheme:only light}
input,select,textarea,button{color-scheme:only light}
::selection{background:var(--mustard);color:var(--ink)}

/* 纸 + 糖色 */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background:#fff}

/* 角落小贴纸 */
.doodle{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.d{position:absolute;font-size:24px;opacity:.75;filter:drop-shadow(2px 2px 0 rgba(43,36,48,.12));
  animation:float 8s ease-in-out infinite}
.d1{left:4%;top:16%;transform:rotate(-12deg)}
.d2{right:6%;top:9%;font-size:19px;animation-delay:-2.4s;transform:rotate(10deg)}
.d3{left:7%;bottom:12%;font-size:18px;animation-delay:-4.8s;transform:rotate(8deg)}
.d4{right:5%;bottom:16%;font-size:20px;animation-delay:-1.2s;transform:rotate(-9deg)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(6deg)}}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-direction:column;gap:6px;
  padding:calc(9px + env(safe-area-inset-top)) 18px 9px;background:var(--cream);
  border-bottom:var(--line)}
.tbrow{display:flex;align-items:center;justify-content:space-between}
.tbsticker{display:flex;justify-content:center;margin-top:1px}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.04em;line-height:1.15}
.brandsub{font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin-top:1px}
.topright{display:flex;align-items:center;gap:8px}
.badge{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);border:2.5px solid var(--ink);
  padding:5px 20px;border-radius:12px;background:var(--pink);white-space:nowrap;
  transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink);letter-spacing:.03em}
.lang{background:var(--cream);border:2px solid var(--ink);color:var(--ink);font-size:12px;
  padding:5px 10px;border-radius:999px;cursor:pointer;font-family:var(--sans);box-shadow:2px 2px 0 var(--ink)}
.lang:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

/* 布局 */
.wrap{max-width:520px;margin:0 auto;padding:10px 18px calc(48px + env(safe-area-inset-bottom))}
h1{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.35;margin:6px 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.7}
h2{font-family:var(--serif);font-size:16px;font-weight:700;margin:22px 0 10px}
h3{font-family:var(--serif);font-size:14px;font-weight:700;margin:24px 0 10px;color:var(--ink)}
h3::before{content:'▍';color:var(--tomato);margin-right:2px}
h4{margin:0 0 4px;font-size:15px;font-weight:700;line-height:1.35}
.hint{color:var(--faint);font-size:12.5px;line-height:1.65;margin:8px 0}
.hint.center{text-align:center}
.hint.warn{color:#c9762f}
.buildtag{text-align:center;font-size:10px;color:#d9c9d0;margin:6px 0 0;letter-spacing:.08em}
.fine{color:var(--faint);font-size:11px;text-align:center;margin-top:14px;line-height:1.6}
.netstat{font-size:11px;text-align:center;margin:6px 0 0;color:var(--faint)}
.netstat.on{color:#2f8f76}
.netstat.off{color:#b9803f}
.kicker{display:block;font-family:var(--serif);font-size:11.5px;color:#c2566a;
  letter-spacing:.14em;text-transform:uppercase;margin:10px 0 2px}

/* 标题那句话，带马克笔底色 */
.hero{font-family:var(--serif);font-size:28px;line-height:1.45;font-weight:700;margin:6px 0 10px;
  display:inline;
  background:linear-gradient(transparent 58%,rgba(255,203,69,.75) 58%,rgba(255,203,69,.75) 92%,transparent 92%)}

/* 表单 */
.field{margin:12px 0}
.field label{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;background:#fff;border:2px solid var(--ink);color:var(--ink);
  border-radius:12px;padding:10px 12px;font-size:15px;font-family:var(--sans);outline:none;
  transition:box-shadow .15s,transform .15s}
input:focus,select:focus,textarea:focus{box-shadow:3px 3px 0 var(--mustard)}
input::placeholder,textarea::placeholder{color:#b9a8b0}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* 按钮：贴纸厚度 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);font-size:14.5px;
  font-family:var(--sans);font-weight:600;padding:10px 16px;border-radius:14px;cursor:pointer;
  box-shadow:var(--sh-s);transition:transform .1s,box-shadow .1s;width:auto}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:#ff6f5e;background:var(--tomato,#ff6f5e);color:#fff;font-weight:700;
  min-height:46px;line-height:1.25;box-shadow:var(--sh);border-color:var(--ink)}
.btn.primary:active{box-shadow:2px 2px 0 var(--ink)}
.btn.big{width:100%;padding:14px;font-size:15.5px;margin-top:16px}
.btn.ghost{background:#fff}
.btn.wide{width:100%;margin-top:14px}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.tiny{padding:4px 10px;font-size:11.5px;border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.linkbtn{display:block;margin:16px auto 0;background:none;border:0;color:#b5566c;font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:var(--sans)}
.link{color:#b5566c;font-size:12.5px;text-decoration:none;display:inline-block;margin-top:4px}
.foot{display:flex;gap:10px;margin-top:26px}
.foot .btn{flex:1}
.foot .btn.primary{flex:1.4}

/* 玩法说明 */
.how{background:#fff;border:var(--line);border-radius:18px;padding:14px 16px 8px;margin:20px 0;box-shadow:var(--sh-s)}
.how h2{margin:0 0 8px;font-size:14px}
.how ol{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.how li{margin:6px 0;padding-left:2px}
.how li::marker{color:var(--tomato);font-family:var(--serif);font-weight:700}

/* 折叠块 */
.net{margin:16px 0;border:var(--line);border-radius:16px;padding:0 14px;background:#fff;box-shadow:var(--sh-s)}
.net summary{padding:11px 0;font-size:13px;color:var(--muted);cursor:pointer;list-style:none;font-weight:600}
.net summary::-webkit-details-marker{display:none}
.net summary::before{content:'＋ ';color:var(--tomato);font-weight:700}
.net[open] summary::before{content:'− '}
.net .rowkey{display:flex;gap:8px;margin:8px 0 6px}
.net .rowkey input{font-size:12.5px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace}
.importer textarea{background:#fdf7f0;border:2px solid var(--ink);border-radius:12px;padding:10px;
  font-size:11.5px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin:6px 0 8px;line-height:1.5}
.importer{padding-bottom:14px}

/* 横幅 */
.banner{margin:10px 18px 0;padding:10px 14px;border-radius:12px;background:var(--mustard);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-size:12.5px;color:var(--ink);box-shadow:var(--sh-s);position:relative;z-index:5;font-weight:600}
.banner button{background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}

/* 猫狗 */
.mascot{position:relative;display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:52px;height:52px;
  font-size:26px;cursor:pointer;padding:0;box-shadow:var(--sh-s);line-height:1;
  transition:transform .1s,box-shadow .1s}
.mascot:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mascot .bub{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px) scale(.92);
  background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 9px;font-size:11.5px;
  color:var(--ink);white-space:nowrap;opacity:0;pointer-events:none;transition:.18s;z-index:6;
  box-shadow:2px 2px 0 var(--ink);font-weight:600}
.mascot.talk .bub{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.mascot.hop{animation:hop .55s ease}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-11px) rotate(-7deg)}65%{transform:translateY(-2px) rotate(5deg)}}
.mascot.pop{border-radius:16px;width:56px;height:56px;flex-direction:column;gap:0}
.mascot.pop .popsung{font-size:15px;margin-bottom:-9px;transform:rotate(-7deg);z-index:2}
.mascot.pop .popbody{font-size:25px;line-height:1}
.mascot.cat{position:absolute;top:-16px;right:-8px;transform:rotate(9deg);width:46px;height:46px;font-size:23px;z-index:3}
.mascot.dog{position:absolute;right:-10px;bottom:-8px;transform:rotate(-7deg);width:44px;height:44px;font-size:22px;z-index:3}
.pair{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.pair .mascot:nth-child(1){transform:rotate(-6deg)}
.pair .mascot:nth-child(2){transform:rotate(6deg)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* 撒出去的小东西 */
.pt{position:fixed;font-size:17px;pointer-events:none;z-index:60;
  animation:pop .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.8) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(1.1);opacity:0}}

/* 换页时跑过去的一串 */
.curtain{position:fixed;left:0;right:0;bottom:0;height:60px;pointer-events:none;z-index:40;overflow:hidden}
.curtain .run{position:absolute;bottom:10px;left:-46px;font-size:26px;opacity:0}
.curtain.play .r1{animation:runby .72s ease-in-out forwards}
.curtain.play .r2{animation:runby .72s ease-in-out .1s forwards;font-size:21px}
.curtain.play .r3{animation:runby .72s ease-in-out .2s forwards;font-size:17px}
@keyframes runby{0%{transform:translateX(0) translateY(8px) rotate(-8deg);opacity:0}
  18%{opacity:1}
  100%{transform:translateX(calc(100vw + 100px)) translateY(-8px) rotate(8deg);opacity:1}}

/* 选择身份 */
.who{display:flex;flex-direction:column;gap:12px;padding-top:26px}
.whoBtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  background:#fff;border:var(--line);border-radius:18px;padding:16px;cursor:pointer;color:var(--ink);
  font-family:var(--sans);box-shadow:var(--sh-s);transition:transform .1s,box-shadow .1s}
.whoBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.whoBtn span{font-family:var(--serif);font-size:20px;font-weight:700}
.whoBtn em{font-style:normal;font-size:11.5px;color:var(--faint);letter-spacing:.06em}

/* 语言页那枚大贴纸 */
.stamp{display:inline-block;align-self:flex-start;background:var(--pink);border:2.5px solid var(--ink);
  border-radius:12px;padding:6px 14px;font-family:var(--serif);font-size:19px;font-weight:700;
  transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink);margin:4px 0 14px;white-space:nowrap}
.stamp em{font-style:normal;font-size:12px;color:#7a3b4c;margin-left:8px;font-family:var(--sans);font-weight:600}

/* 选择语言 */
.langpick{padding-top:30px;min-height:74vh;display:flex;flex-direction:column;justify-content:center}
.langpick h1{font-size:27px;line-height:1.38}
.langpick h1 em{display:block;font-style:normal;font-size:17px;color:var(--muted);font-weight:400;margin-top:8px}
.langpick .sub{font-size:13px;line-height:1.75;margin-bottom:20px}
.langBtn{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin:7px 0;
  padding:16px 18px;border-radius:16px;border:var(--line);background:#fff;color:var(--ink);
  font-family:var(--serif);font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--sh);
  transition:transform .1s,box-shadow .1s}
.langBtn small{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.langBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.langBtn:nth-of-type(2){background:var(--mustard)}

/* 搜索 */
.searchbox{position:relative;margin:6px 0 14px}
.sres{display:none;margin-top:8px;border:var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh-s);max-height:64vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sres.on{display:block}
.srow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:2px solid #f0e6dc;
  padding:9px 10px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--sans)}
.srow:last-child{border-bottom:0}
.srow.on{background:#fff6d9}
.srow .st{display:flex;flex-direction:column;min-width:0;flex:1}
.srow .st em{font-style:normal;font-size:11px;color:var(--faint)}
.srow .tick{color:var(--tomato);font-style:normal;font-size:14px;font-weight:700}
.srow.addown{color:#b5566c;font-size:12.5px;padding:11px 10px;font-weight:600}
.sempty{padding:10px;color:var(--faint);font-size:12.5px;border-bottom:2px solid #f0e6dc}
.sempty.tiny{font-size:11px}
.srow.ai{color:#7a4fd0;font-weight:700;background:#f6f1ff}

/* 海报 */
.poster{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(160deg,hsl(var(--h,330) 85% 90%),hsl(calc(var(--h,330) + 36) 80% 80%));
  border:2px solid var(--ink)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{display:none;font-family:var(--serif);font-weight:700;color:hsl(var(--h,330) 45% 38%);font-size:22px}
.poster.noposter .ph{display:block}
.poster.big{width:100%;aspect-ratio:2/3;max-height:42vh;border-radius:14px}
.poster.mid{width:56px;height:82px;border-radius:8px;border-width:2px}
.poster.mini{width:30px;height:44px;border-radius:6px;border-width:1.5px}
.poster.tiny{width:26px;height:38px;border-radius:5px;border-width:1.5px}

/* 已选 */
.chips{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);
  border-radius:12px;padding:6px 10px 6px 6px;box-shadow:2px 2px 0 rgba(43,36,48,.85)}
.chip-t{display:flex;flex-direction:column;flex:1;min-width:0;font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-t span{font-size:11px;color:var(--faint)}
.chip .x{background:none;border:0;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;padding:4px 6px}

/* 内置片单格 */
.offline{margin-top:22px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.catItem{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;
  color:var(--muted);font-size:11px;cursor:pointer;padding:0;font-family:var(--sans)}
.catItem .poster{width:100%;aspect-ratio:2/3;border-radius:9px;transition:transform .12s,box-shadow .15s}
.catItem span{text-align:center;line-height:1.25;max-height:2.5em;overflow:hidden}
.catItem.on .poster{box-shadow:0 0 0 3px var(--tomato),2px 2px 0 var(--ink)}
.catItem.on{color:#b5566c;font-weight:700}
.catItem:active .poster{transform:scale(.96)}

/* 生成中 */
.build .steps{list-style:none;padding:0;margin:26px 0;display:flex;flex-direction:column;gap:14px}
.build .steps li{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:14px;font-weight:600;transition:color .3s}
.build .steps li i{width:10px;height:10px;border-radius:50%;border:2px solid #d9c9bf;flex:none;transition:all .3s}
.build .steps li.cur{color:var(--ink)}
.build .steps li.cur i{border-color:var(--tomato);background:var(--tomato);animation:pulse 1.1s infinite}
.build .steps li.done{color:var(--muted)}
.build .steps li.done i{background:var(--mint);border-color:var(--ink)}
@keyframes pulse{50%{opacity:.35}}
.loadbar{height:10px;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:8px}
.loadbar i{display:block;height:100%;width:40%;
  background:repeating-linear-gradient(45deg,var(--mustard),var(--mustard) 8px,var(--tomato) 8px,var(--tomato) 16px);
  animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* 打分 */
.rtitle{font-size:20px;margin:2px 0 12px;line-height:1.4}
.rhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);
  font-weight:600;margin:6px 0 8px}
.rhead .cnt{font-family:var(--serif);color:var(--ink);font-size:13px}
.rbar{height:10px;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--tomato);transition:width .35s}
.deck{position:relative;margin:18px 0}
.card{position:relative;background:#fff;border:var(--line);border-radius:20px;padding:10px;
  box-shadow:6px 6px 0 var(--ink);animation:rise .32s cubic-bezier(.2,.8,.3,1)}
.card::before{content:'';position:absolute;top:-9px;left:50%;width:58px;height:16px;
  transform:translateX(-50%) rotate(-2deg);border:2px solid var(--ink);border-radius:3px;
  background:repeating-linear-gradient(45deg,var(--mustard),var(--mustard) 6px,#ffe28a 6px,#ffe28a 12px)}
@keyframes rise{from{opacity:0;transform:translateY(12px) rotate(-1deg)}to{opacity:1;transform:none}}
.card.leaving-yes{animation:leaveYes .25s ease forwards}
.card.leaving-no{animation:leaveNo .25s ease forwards}
@keyframes leaveYes{to{transform:translate(80px,-50px) rotate(9deg);opacity:0}}
@keyframes leaveNo{to{transform:translate(-80px,30px) rotate(-9deg);opacity:0}}
.cbody{padding:12px 6px 6px}
.badges{font-size:11px;color:var(--muted);letter-spacing:.03em;font-weight:600}
.card h2{font-size:20px;margin:5px 0 3px}
.genres{font-size:12px;color:#b5566c;font-weight:600}
.ov{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7;max-height:5.2em;overflow:hidden}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rate{border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;
  padding:11px 8px;font-size:12.5px;font-family:var(--sans);font-weight:700;cursor:pointer;
  box-shadow:var(--sh-s);transition:transform .1s,box-shadow .1s;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.rate.b2{background:var(--tomato);color:#fff}
.rate.b1{background:var(--mustard)}
.rate.b3{background:var(--lilac)}
.rate.b0{background:#fff;color:var(--muted)}

/* 二维码 */
.qrrow{display:flex;gap:8px;margin:6px 0 4px}
.qr{display:none}
.qr.on{display:block}
.qr img{width:100%;max-width:320px;height:auto;display:block;margin:8px auto}
.qr .btn{margin:0 auto 4px;display:block}

/* 口味分类 */
.tblock{margin:18px 0 8px}
.tblock h2{margin:0 0 6px;font-size:16px}
.tlabel{font-size:11.5px;color:var(--faint);margin:12px 0 6px;font-weight:600;letter-spacing:.04em}
.tchips{display:flex;flex-wrap:wrap;gap:7px}
.tchip{background:#fff;border:2px solid var(--ink);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-family:var(--sans);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.tchip.on{background:var(--mustard);color:var(--ink);font-weight:700}
.tchip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

/* 共同口味 */
.shared{background:#fff;border:var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--sh-s)}
.sh-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.sh-top span{font-family:var(--serif);font-size:14px}
.sh-top b{font-family:var(--serif);font-size:18px;color:#c4506f}
.sh-g{margin:6px 0 0;font-size:13px;color:var(--ink);font-weight:600}
.sh-s{margin:3px 0 0;font-size:12px;color:var(--muted)}
.sh-tag{margin:5px 0 0;font-size:11.5px;color:var(--faint);line-height:1.5}
.sh-tag i{font-style:normal;display:inline-block;background:#f6e8ed;color:#8a7480;border-radius:6px;padding:0 6px;margin-right:5px;font-size:10.5px}

/* 推荐卡片 */
.rec{background:#fff;border:var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh-s)}
.rec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rec-h h4{font-size:15px}
.rec-h span{font-size:11px;color:var(--faint)}
.rec-why{font-size:12px;color:var(--muted);margin:6px 0 8px;line-height:1.6}
.btn.tiny.on{background:var(--mint)}

/* 等待 */
.wait{text-align:center;padding-top:38px}
.big-emoji{font-size:40px;margin-bottom:6px}
.wait h1{font-size:21px}

/* 结果 */
.tabs{display:flex;gap:6px;background:#fff;border:var(--line);border-radius:14px;padding:5px;
  margin:8px 0 20px;box-shadow:var(--sh-s)}
.tab{flex:1;background:none;border:0;color:var(--muted);font-size:12.5px;padding:7px 4px;border-radius:9px;
  cursor:pointer;font-family:var(--sans);font-weight:700;transition:all .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--mustard);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.scorebox{position:relative;width:152px;height:152px;margin:6px auto 6px}
.ring{width:100%;height:100%;display:block}
.rbg{fill:#fff;stroke:#eadfd2;stroke-width:2}
.rfg{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--tomato);
  transition:stroke-dasharray .9s cubic-bezier(.2,.8,.3,1)}
.rfg.b_soul{stroke:var(--mustard)}
.rfg.b_high{stroke:var(--tomato)}
.rfg.b_mid{stroke:var(--lilac)}
.rfg.b_low{stroke:var(--sky)}
.rfg.b_hard{stroke:#c9bcc2}
.ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px}
.ringtxt b{font-family:var(--serif);font-size:42px;font-weight:700;letter-spacing:-.02em}
.ringtxt span{font-size:14px;color:var(--faint);align-self:center;margin-top:8px}
.band{text-align:center;font-family:var(--serif);font-size:15px;margin:6px 0 2px;line-height:1.5;padding:0 8px;font-weight:700}
.parts{margin:22px 0 6px;display:flex;flex-direction:column;gap:9px}
.part{display:grid;grid-template-columns:5.6em 1fr 2.2em;align-items:center;gap:10px;font-size:11.5px;
  color:var(--muted);font-weight:600}
.part em{font-style:normal;text-align:right;color:var(--muted);font-family:var(--serif)}
.pb{height:10px;background:#fff;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--mint);transition:width .6s}
.pcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 8px}
.pcol{background:#fff;border:var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh-s)}
.pcol h4{font-family:var(--serif);font-size:13px;margin-bottom:9px}
.pcol.ca h4{color:#9a6a15}
.pcol.cb h4{color:#b5566c}
.pg{display:grid;gap:4px;margin-bottom:8px}
.pg span{font-size:11.5px;color:var(--muted);font-weight:600}
.pg i{display:block;height:6px;border-radius:2px;background:var(--mustard);border:1.5px solid var(--ink)}
.pcol.cb .pg i{background:var(--pink)}
.ptone{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);
  padding-top:5px;border-top:2px solid #f0e6dc;margin-top:6px;font-weight:600}
.ptone b{font-weight:700;color:var(--muted)}
.qrow{border:2px solid var(--ink);border-radius:12px;margin-bottom:8px;overflow:hidden;background:#fff;
  box-shadow:2px 2px 0 var(--ink)}
.qrow summary{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;
  list-style:none;font-size:13px;font-weight:700}
.qrow summary::-webkit-details-marker{display:none}
.qrow summary em{font-style:normal;font-family:var(--serif);color:var(--muted);font-size:12.5px}
.qrow.mutual summary b{color:#b5566c}
.qrow.div summary b{color:#b9803f}
.qitems{padding:0 12px 10px}
.qi{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;
  border-top:1.5px dashed #ecdfd3;font-weight:500}
.qi i{font-style:normal;color:var(--faint);font-size:11px}

/* 片单 */
.li{position:relative;display:grid;grid-template-columns:22px 56px 1fr;gap:11px;background:#fff;
  border:var(--line);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--sh-s)}
.rank{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);text-align:center;padding-top:2px}
.libody{min-width:0}
.libody h4{font-size:15px;margin-bottom:2px}
.why{font-size:11.5px;color:#b5566c;margin:4px 0 6px;line-height:1.55;font-weight:600}
.lirow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.weeks{font-size:11px;color:var(--faint);font-weight:600}
.firstflag{display:inline-block;font-size:10px;font-weight:700;color:var(--ink);background:var(--mustard);
  border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin:0 0 5px}
.linkbtn.faint{color:var(--faint);margin-top:22px;font-size:11.5px;text-decoration:none}
.prov{font-size:11px;color:var(--faint);margin:2px 0 6px;line-height:1.55}
.prog{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--muted);align-items:center;font-weight:600}
.prog>span{display:inline-flex;align-items:center;gap:5px}
.prog b{font-family:var(--serif);color:var(--ink);font-weight:700;min-width:2.6em;text-align:center}
.pbtn{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:7px;
  width:25px;height:25px;font-size:13px;line-height:1;cursor:pointer;padding:0;box-shadow:1.5px 1.5px 0 var(--ink)}
.pbtn:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
.pbtn.on{background:var(--mint)}
.spoiler{width:100%;font-size:11px;color:#b9803f;margin:2px 0 0;font-weight:600}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:26px 10px;line-height:1.7}

/* 日程 */
.planrow{display:flex;gap:9px;margin-bottom:10px}
.planrow .field{flex:1;margin:0}
.session{display:grid;gap:3px;margin:14px 0 8px}
.session>div{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
.session em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.session b{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--ink)}
.progrow{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;padding:10px 0;
  border-bottom:2px solid #f0e6dc}
.progrow>span{font-size:13px;grid-column:2;font-weight:600}
.progrow .prog{grid-column:2;margin-top:4px}
.progrow .spoiler{grid-column:2}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:88vw;text-align:center;
  box-shadow:0 12px 26px -12px rgba(43,36,48,.7)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:560px){
  body{font-size:15.5px}
  .wrap{padding-left:22px;padding-right:22px}
  .poster.big{max-height:48vh}
}
/* 实验性：给"整页反色"的浏览器做反向补偿（连点徽章 5 下开关） */
html.antiinvert{filter:invert(1) hue-rotate(180deg);background:#000}
html.antiinvert body{background:#000 !important}

/* 不跟随系统深色：任何情况下都保持白底 */
@media (prefers-color-scheme:dark){
  :root{color-scheme:only light;
    --paper:#ffffff; --cream:#ffffff; --ink:#2b2430; --muted:#6f5c65; --faint:#8d7a83;}
  html,body{background:#fff !important;color:#2b2430 !important}
  .bg{background:#fff !important}
  .topbar{background:#fff !important}
  /* 只压输入类控件；按钮不能压，否则主按钮会白底白字 */
  input,select,textarea{color-scheme:only light;background-color:#fff!important;color:#2b2430!important}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

      if (stage() === 'setup') render();
    }).catch(function () {
      ui.netStatus = 'off';

  /* ---------------- 候选池 ---------------- */
  function allSeeds() {
    var seen = {}, out = [];
    st.a.seeds.concat(st.b.seeds).forEach(function (s) {
      if (s && s.k && !seen[s.k]) { seen[s.k] = 1; out.push(s); }
    });
    return out;
  }

  function combinedProfile() {
    var pa = C.buildProfile(st.a.seeds), pb = C.buildProfile(st.b.seeds);
    var g = {}, k;
    for (k in pa.g) g[k] = (g[k] || 0) + pa.g[k];
    for (k in pb.g) g[k] = (g[k] || 0) + pb.g[k];
    var na = st.a.seeds.length, nb = st.b.seeds.length, n = Math.max(1, na + nb);
    return {
      g: g,
      tone: (pa.tone * na + pb.tone * nb) / n,
      tvRatio: (pa.tvRatio * na + pb.tvRatio * nb) / n,
      rt: (pa.rt * na + pb.rt * nb) / n,
      eps: (pa.eps * na + pb.eps * nb) / n,
      count: na + nb
    };
  }

  function topGenres(prof, n) {
    return Object.keys(prof.g).map(Number)
      .sort(function (a, b) { return prof.g[b] - prof.g[a]; })
      .slice(0, n);
  }

  async function generate() {
    ui.busy = true;
    ui.log = [];
    ui.forceSeeds = false;
    render();
    var add = function (k) { if (ui.log.indexOf(k) < 0) { ui.log.push(k); render(); } };
    add('b1');
    await sleep(120);

    var seeds = allSeeds();
    var prof = combinedProfile();
    var seedKeys = {};
    seeds.forEach(function (s) { seedKeys[s.k] = 1; });

    var cands = D.CATALOG.filter(function (it) { return !seedKeys[it.k]; });

    add('b2');
    try {
      if (hasTmdb()) {
        var recLists = await concurrency(seeds.filter(function (s) { return s.id; }).slice(0, 6), 4, tmdbRecs);
        cands = cands.concat([].concat.apply([], recLists));
      } else if (ui.netStatus !== 'off') {
        var terms = topGenres(prof, 2).map(function (id) { return IT_TERM[id]; }).filter(Boolean);
        var genreLists = await concurrency(terms, 2, function (t) { return itunesSearch(t, 18); });
        cands = cands.concat([].concat.apply([], genreLists));
      }
    } catch (e) { /* 联网失败就只用内置片单 */ }
    add('b3');
    await sleep(80);

    var seen = {}, scored = [];
    cands.forEach(function (it) {
      if (!it || !it.k || seen[it.k] || seedKeys[it.k]) return;
      seen[it.k] = 1;
      scored.push({ it: it, s: C.candidateScore(prof, it) });
    });
    scored.sort(function (a, b) { return b.s - a.s; });

    var picked = scored.slice(0, 18).map(function (x) { return x.it; });
    /* 别让内置片单把联网找到的新东西全挤掉：至少留 4 个联网来源 */
    var netAll = scored.filter(function (x) { return x.it.src && x.it.src !== 'cat'; }).map(function (x) { return x.it; });
    var inTop = picked.filter(function (it) { return it.src && it.src !== 'cat'; }).length;
    if (netAll.length && inTop < 4) {
      var extra = netAll.filter(function (it) { return picked.indexOf(it) < 0; }).slice(0, 4 - inTop);
      if (extra.length) picked = picked.slice(0, 18 - extra.length).concat(extra);
    }
    if (hasTmdb()) picked = await concurrency(picked, 4, enrich);
    add('b4');

    var merged = [], mseen = {};
    st.pool.concat(picked).forEach(function (it) {
      if (!it || mseen[it.k]) return;
      mseen[it.k] = 1;
      merged.push(it);
    });
    st.pool = merged.slice(0, 24);
    saveState();
    await sleep(150);
    ui.busy = false;
    render();
  }

  /* --- 打分 --- */

  /* ---------------- 口味：类型 → 细分（电影/剧集分开） ---------------- */
  function genreIdByName(n) {
    if (!n) return 0;
    for (var i = 0; i < C.GENRE_LIST.length; i++) {
      var g = C.GENRE_LIST[i];
      if (g.zh === n || g.ru === n) return g.id;
    }
    var low = String(n).toLowerCase();
    for (var j = 0; j < C.GENRE_LIST.length; j++) {
      if (C.GENRE_LIST[j].zh.indexOf(n) >= 0 || low === String(C.GENRE_LIST[j].id)) return C.GENRE_LIST[j].id;
    }
    return 0;
  }

  function toneOf(list) {
    var s = 0, n = 0;
    (list || []).forEach(function (it) { s += C.itemTone(it); n++; });
    return n ? s / n : 0;
  }

  function localTaste() {
    var out = {};
    function one(list, key) {
      if (!list.length) return;
      var g = {};
      list.forEach(function (s) { (s.genres || []).forEach(function (id) { if (C.GENRE[id]) g[id] = (g[id] || 0) + 1; }); });
      var top = Object.keys(g).map(Number).sort(function (a, b) { return g[b] - g[a]; }).slice(0, 6);
      var t = toneOf(list);
      out[key] = { g: top, sub: [], tone: t < -0.2 ? 'dark' : t > 0.2 ? 'light' : 'any', pace: 'any', all: top.slice() };
    }
    one(mySeeds().filter(function (s) { return s.media === 'movie'; }), 'film');
    one(mySeeds().filter(function (s) { return s.media !== 'movie'; }), 'tv');
    return out;
  }

  function askTaste() {
    var film = mySeeds().filter(function (x) { return x.media === 'movie'; })
      .map(function (x) { return titleOf(x) + (x.year ? '（' + x.year + '）' : ''); });
    var tv = mySeeds().filter(function (x) { return x.media !== 'movie'; })
      .map(function (x) { return titleOf(x) + (x.year ? '（' + x.year + '）' : ''); });
    if (!film.length && !tv.length) return Promise.reject(new Error('noseeds'));
    var gl = C.GENRE_LIST.map(function (g) { return g.zh; }).join('、');
    return fetchJSON('https://api.deepseek.com/chat/completions', 16000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + AI_KEY },
      body: JSON.stringify({
        model: 'deepseek-chat', temperature: 0.2, max_tokens: 800,
        response_format: { type: 'json_object' },
        messages: [
          {
            role: 'system',
            content: '你是影视口味分析师。根据用户最喜欢的片子归纳口味，只输出 JSON：' +
              '{"film":{"genres":["剧情"],"sub":["烧脑反转"],"tone":"dark","pace":"slow"},"tv":{...}}。' +
              'genres 只能从这些里选 3–6 个：' + gl + '。' +
              'tags 是 5–8 个中文细分标签（例如：超级英雄、法庭剧、时空循环、家庭群像、犯罪群像、慢热治愈、非线性叙事、女性视角、年代怀旧、复仇题材）。要具体，不要和 genres 重复。' +
              'tone 取 light/dark/any；pace 取 slow/fast/any；line 是一句 20 字以内的口味总结。' +
              '用户没给的那一类就省略这个键。'
          },
          { role: 'user', content: '最喜欢的电影：' + (film.join('、') || '（无）') + '\n最喜欢的剧集：' + (tv.join('、') || '（无）') }
        ]
      })
    }).then(function (d) {
      var txt = ((d.choices || [])[0] || {}).message && d.choices[0].message.content || '{}';
      var o = {};
      try { o = JSON.parse(txt); } catch (e) { o = {}; }
      var out = {};
      ['film', 'tv'].forEach(function (k) {
        var x = o[k];
        if (!x) return;
        var g = (x.genres || []).map(genreIdByName).filter(Boolean).slice(0, 6);
        out[k] = {
          g: g.slice(),
          sub: ((x.tags || x.sub || [])).slice(0, 8),
          line: x.line || '',
          tone: x.tone === 'light' || x.tone === 'dark' ? x.tone : 'any',
          pace: x.pace === 'slow' || x.pace === 'fast' ? x.pace : 'any',
          all: g.slice()
        };
      });
      return out;
    });
  }

  /* ---------------- 共同口味 + AI 推荐 ---------------- */
  function askRecs() {
    var sh = C.sharedTaste(st.a.taste, st.b.taste);
    var parts = [];
    ['film', 'tv'].forEach(function (k) {
      var x = sh[k];
      if (!x || (!x.g.length && !x.sub.length)) return;
      var ta = (st.a.taste && st.a.taste[k] && st.a.taste[k].sub) || [];
      var tb = (st.b.taste && st.b.taste[k] && st.b.taste[k].sub) || [];
      parts.push((k === 'film' ? '电影' : '剧集') + '——共同类型：' + (x.g.map(gname).join('、') || '（未定）') +
        (x.sub.length ? '；共同标签：' + x.sub.join('、') : '') +
        (ta.length ? '；' + nm('a') + ' 的标签：' + ta.join('、') : '') +
        (tb.length ? '；' + nm('b') + ' 的标签：' + tb.join('、') : ''));
    });
    var mine = mySeeds().slice(0, 8).map(function (x) { return titleOf(x) + (x.year ? '（' + x.year + '）' : ''); });
    if (!parts.length) parts.push('口味：' + (st[me].taste && st[me].taste.film ? st[me].taste.film.g.map(gname).join('、') : '剧情'));
    return fetchJSON('https://api.deepseek.com/chat/completions', 20000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + AI_KEY },
      body: JSON.stringify({
        model: 'deepseek-chat', temperature: 0.4, max_tokens: 1600,
        response_format: { type: 'json_object' },
        messages: [
          {
            role: 'system',
            content: '两个人要一起追剧。根据他们的共同口味，推荐 4 部电影和 4 部剧集，优先两边都能看到、口碑好、篇幅不长的。' +
              '只输出 JSON：{"items":[{"zh":"","ru":"","en":"","year":0,"media":"movie","genres":[""],"eps":0,"rt":0,"why":"一句为什么适合你们"}]}。' +
              'genres 只能从：动作、冒险、动画、喜剧、犯罪、纪录片、剧情、家庭、奇幻、历史、恐怖、音乐、悬疑、爱情、科幻、惊悚、战争、西部 里选 1–2 个。'
          },
          { role: 'user', content: '共同口味：' + parts.join('；') +
            (mine.length ? '\n其中一方自己挑过的片子：' + mine.join('、') : '') +
            '\n请依据上面的标签（尤其是共同标签）来推，别只按大类。' }
        ]
      })
    }).then(function (d) {
      var txt = ((d.choices || [])[0] || {}).message && d.choices[0].message.content || '{}';
      var o = {};
      try { o = JSON.parse(txt); } catch (e) { o = {}; }
      return (o.items || []).slice(0, 8).map(function (x) {
        var t = { zh: x.zh || '', ru: x.ru || '', en: x.en || '' };
        if (!t[lang]) t[lang] = t.zh || t.ru || t.en;
        return {
          k: 'rec:' + (x.en || x.zh || x.ru || ''),
          media: x.media === 'tv' ? 'tv' : 'movie', id: null, src: 'ai',
          year: Number(x.year) || 0, eps: Number(x.eps) || 0, rt: Number(x.rt) || 0,
          genres: (x.genres || []).map(genreIdByName).filter(Boolean),
          poster: '', overview: x.why || '', title: t
        };
      }).filter(function (x) { return x.title.zh || x.title.ru || x.title.en; });
    });
  }

  function profileCompare(comp) {
    function top(p) {
      return Object.keys(p.g).map(function (k) { return [Number(k), p.g[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
    }
    function col(name, p, cls) {
      var items = top(p);
      var max = Math.max(1, items.reduce(function (m, x) { return Math.max(m, x[1]); }, 1));
      return '<div class="pcol ' + cls + '"><h4>' + esc(name) + '</h4>' +
        items.map(function (x) {
          return '<div class="pg"><span>' + esc(gname(x[0])) + '</span><i style="width:' + Math.round(x[1] / max * 100) + '%"></i></div>';
        }).join('') +
        '<div class="ptone"><span>' + esc(tr('tone')) + '</span><b>' + esc(toneWord(p.tone)) + '</b></div>' +
        '<div class="ptone"><span>' + esc(tr('mediaMix')) + '</span><b>' + Math.round(p.tvRatio * 100) + '% / ' + Math.round((1 - p.tvRatio) * 100) + '%</b></div>' +
        '</div>';
    }
    return '<div class="pcmp">' + col(nm('a'), comp.profA, 'ca') + col(nm('b'), comp.profB, 'cb') + '</div>';
  }

  function toneWord(t) {
    if (t <= -0.35) return tr('toneDark');
    if (t >= 0.25) return tr('toneLight');

    var next = C.nextWeekly(plan.weekday, plan.hh, plan.mm, plan.tzA);

  function localSearch(q) {
    var s = q.trim().toLowerCase();
    if (s.length < 1) return [];
    return D.CATALOG.filter(function (it) {
      return [it.title.zh, it.title.ru, it.title.en].some(function (t) {

  function runSearch(q) {
    q = (q || '').trim();
    if (q.length < 1) { ui.search = []; renderSearchResults(); return; }
    var local = localSearch(q);
    ui.aiList = [];
    ui.liveList = [];
    ui.search = local;
    ui.searching = true;
    ui.aiBusy = false;
    ui.aiDone = false;
    renderSearchResults();
    function compose() {
      return mergeSearch(ui.aiList, local.concat(ui.liveList));
    }

    /* AI 默认并行跑：不等到搜不到才用，电影/生僻名都靠它补 */
    if (AI_KEY && q.length >= 2 && ui.aiTried !== q) {
      ui.aiTried = q;
      ui.aiBusy = true;
      renderSearchResults();
      askAI(q).then(function (list) {
        if (q !== ui.query.trim()) return;
        ui.aiBusy = false;
        ui.aiDone = list.length > 0;
        ui.aiList = list;
        ui.search = compose();
        renderSearchResults();
      }).catch(function () {
        if (q !== ui.query.trim()) return;
        ui.aiBusy = false;
        renderSearchResults();
      });
    }

    searchEverywhere(q, function (net) {
      if (q !== ui.query.trim()) return;
      ui.liveList = dedupe(ui.liveList.concat(net));
      ui.search = compose();
      renderSearchResults();
    }, function () {
      if (q !== ui.query.trim()) return;
      ui.searching = false;
      renderSearchResults();
    });
  }

  /* 二维码：画成和页面一致的小卡片，可保存成图片发人 */
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawQR(qr, n) {
    var W = 760, H = 940;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    if (!g) return null;
    g.fillStyle = '#fff9f2';
    g.fillRect(0, 0, W, H);
    roundRect(g, 26, 26, W - 52, H - 52, 40);
    g.fillStyle = '#ffffff';
    g.fill();
    g.lineWidth = 8;
    g.strokeStyle = '#2b2430';
    g.stroke();
    g.textAlign = 'center';
    g.fillStyle = '#2b2430';
    g.font = '700 46px "Noto Serif SC", Georgia, serif';
    g.fillText('Maria 专属', W / 2, 112);
    g.fillStyle = '#8a7480';
    g.font = '400 22px system-ui, sans-serif';
    g.fillText('扫一下，把我的口味带给你', W / 2, 154);
    var size = 560, x0 = (W - size) / 2, y0 = 196, cell = size / n;
    g.fillStyle = '#ffffff';
    g.fillRect(x0 - 14, y0 - 14, size + 28, size + 28);
    g.fillStyle = '#2b2430';
    for (var r = 0; r < n; r++) {
      for (var col = 0; col < n; col++) {
        if (qr.isDark(r, col)) g.fillRect(x0 + col * cell, y0 + r * cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
    g.fillStyle = '#8a7480';
    g.font = '400 20px system-ui, sans-serif';
    g.fillText('扫完复制文字，粘到页面里的输入框', W / 2, H - 62);
    return c;
  }

  async function showQR() {
    var box = document.getElementById('qr');
    if (!box) return;
    box.classList.add('on');
    box.innerHTML = '<p class="hint">…</p>';
    try {
      var tmp = JSON.parse(JSON.stringify(st));
      tmp.recs = [];
      var payload = await C.encodeState(tmp);
      if (typeof window.qrcode !== 'function') throw new Error('no-qr-lib');
      /* 如果这页是通过网址打开的，二维码就直接指向“网址+口味”，扫一下就能进 */
      ui.qrIsUrl = /^https?:/.test(location.protocol) && !!location.href;
      var qrText = ui.qrIsUrl ? location.href.split('#')[0] + '#s=' + payload : payload;
      var qr = window.qrcode(0, 'M');
      qr.addData(qrText);
      qr.make();
      var n = qr.getModuleCount();
      var canvas = drawQR(qr, n);
      if (canvas) {
        var url = canvas.toDataURL('image/png');
        ui.qrURL = url;
        box.innerHTML = '<img class="qrimg" alt="QR" src="' + url + '">' +
          '<button class="btn small" data-act="saveQR">' + esc(tr('qrSave')) + '</button>' +
          '<p class="hint">' + esc(ui.qrIsUrl ? tr('qrHintUrl') : tr('qrHint')) + '</p>';
      } else {
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true }) +
          '<p class="hint">' + esc(tr('qrHint')) + '</p>';
      }
    } catch (e) {
      box.innerHTML = '<p class="hint warn">' + esc(tr('qrTooLong')) + ' (' + esc(e.message || e) + ')</p>';
    }
  }

  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).catch(function () { legacyCopy(txt); });
    }
    legacyCopy(txt);
    return Promise.resolve();
  }
  function legacyCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }

      return;

    if (act === 'build') { generate(); return; }
    if (act === 'toTaste') {
      st[me].taste = null;
      ui.tasteDraft = null;
      ui.tasteAI = false;
      ui.forceSeeds = false;

    if (act === 'rate') { rateWith(Number(el.getAttribute('data-v'))); return; }
    if (act === 'poke') { poke(el); return; }
    if (act === 'tchip') {
      var gk = el.getAttribute('data-g'), tk = el.getAttribute('data-t');
      var val = tk === 'g' ? Number(el.getAttribute('data-v')) : el.getAttribute('data-v');
      var d0 = ui.tasteDraft && ui.tasteDraft[gk];

  /* 本地已经有口味，导入的数据在同一个位置上也有口味、名字还不同 → 我其实是另一个人 */
  function swapSideIfNeeded(inc) {
    if (!me || !inc) return;
    var mine = st[me];
    var theirs = inc[me];
    if (!mine || !mine.taste || !theirs || !theirs.taste) return;
    var myName = (st.names && st.names[me]) || '';
    var inName = (inc.names && inc.names[me]) || '';
    if (!inName || !myName || inName === myName) return;
    var other = me === 'a' ? 'b' : 'a';
    st[other] = JSON.parse(JSON.stringify(mine));
    st[me] = { seeds: [], ratings: {}, watched: {}, taste: null, picked: {} };
    me = other;
    try { store.setItem(LS_ME, me); } catch (e) {}
    if (st.names) { var n = (inc.names && inc.names[me]) || ''; if (n) st.names[me] = n; }
  }

    var it = st.pool.filter(function (x) { return x.k === k; })[0];
    if (!it || !it.id || !hasTmdb()) { ui.prov[k] = { ru: [], cn: [] }; render(); return; }
    if (ui.prov[k] && ui.prov[k] !== 'loading') return;
    ui.prov[k] = 'loading'; render();
    tmdb((it.media === 'tv' ? '/tv/' : '/movie/') + it.id + '/watch/providers', {}).then(function (d) {
      var res = d.results || {};
      function names(cc) {
        var x = res[cc];
        if (!x) return [];
        var arr = [].concat(x.flatrate || [], x.free || [], x.ads || []);
        var seen = {}, out = [];
        arr.forEach(function (p2) {
          if (p2 && p2.provider_name && !seen[p2.provider_name]) { seen[p2.provider_name] = 1; out.push(p2.provider_name); }
        });
        return out.slice(0, 4);
      }
      ui.prov[k] = { ru: names('RU'), cn: names('CN') };
      render();
    }).catch(function () { ui.prov[k] = { ru: [], cn: [] }; render(); });
  }

  function stepEp(el) {
    var k = el.getAttribute('data-k'), side = el.getAttribute('data-side');
    var d = Number(el.getAttribute('data-d'));
    var it = st.pool.filter(function (x) { return x.k === k; })[0];
    var max = it && it.eps ? it.eps : 999;
    var cur = st[side].watched[k] || 0;
    st[side].watched[k] = Math.max(0, Math.min(max, cur + d));
    saveState(); render();
  }

  function toggleSeen(el) {
    var k = el.getAttribute('data-k'), side = el.getAttribute('data-side');
    st[side].watched[k] = (st[side].watched[k] || 0) > 0 ? 0 : 1;
    saveState(); render();
  }

  /* ---------------- 启动 ---------------- */
  /* 逼浏览器放弃深色渲染（不支持的引擎会静默忽略） */
  (function lockLight() {
    try {
      document.documentElement.style.colorScheme = 'only light';
      var m = document.querySelector('meta[name="color-scheme"]');
      if (m) m.setAttribute('content', 'only light');
      var st = document.createElement('style');
      st.textContent = 'html,body{background:#fff!important;color-scheme:only light}';
      document.head.appendChild(st);
    } catch (e) {}
  })();

  /* 长按徽章：在这台手机上安装 / 删除 DeepSeek key（不写进文件） */
  function askKey() {
    var ru = lang === 'ru';
    var v = null;
    try {
      v = window.prompt(ru ? 'Ключ DeepSeek — хранится только на этом телефоне' : '粘贴 DeepSeek Key（只存在这台手机上，不写进文件）', '');
    } catch (e) { v = null; }
    if (v == null) return;
    v = v.trim();
    if (!v) {
      try { store.removeItem('cw.ai'); } catch (e) {}
      AI_KEY = '';
      toast(ru ? 'ключ удалён' : '已删除 AI key');
      render();
      return;
    }
    if (!/^sk-[A-Za-z0-9]{10,}$/.test(v)) { toast(ru ? 'не похоже на ключ' : '这不像一个 key'); return; }
    try { store.setItem('cw.ai', v); } catch (e) {}
    AI_KEY = v;
    toast(ru ? 'ключ сохранён на этом устройстве' : 'AI key 已存在这台手机上');
    render();
  }

  /* 连点右上角徽章 5 下：反向补偿浏览器的整页反色，用来判断是谁在变黑 */
  (function tapEscape() {
    var el = document.getElementById('mariaBadge');
    if (!el) return;
    var pressT = null;
    el.addEventListener('pointerdown', function () {
      clearTimeout(pressT);
      pressT = setTimeout(function () { pressT = null; askKey(); }, 1100);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'contextmenu'].forEach(function (ev) {
      el.addEventListener(ev, function () { clearTimeout(pressT); pressT = null; });
    });
    var n = 0, t = null;
    el.addEventListener('click', function () {
      n++;
      clearTimeout(t);
      t = setTimeout(function () { n = 0; }, 1300);
      if (n < 5) return;
      n = 0;
      var on = document.documentElement.classList.toggle('antiinvert');
      toast(on ? (lang === 'ru' ? 'компенсация включена' : '反色补偿：开') : (lang === 'ru' ? 'компенсация выключена' : '反色补偿：关'));
    });
  })();

  (async function boot() {
    try {
      var m = /[#&]s=([A-Za-z0-9_\-]+)/.exec(location.hash || '');
      if (m) {
        var inc = await C.decodeState(m[1]);
        if (inc && (inc.names.a || inc.names.b)) {
          var empty = !st.a.seeds.length && !st.b.seeds.length && !st.pool.length && !st.names.a && !st.names.b;
          if (empty) {
            st = inc;
            saveState();
            try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
            var first = document.getElementById('app');
            setTimeout(function () { render(); }, 0);
          } else {
            ui.pending = inc;
          }
        }
      }
    } catch (e) {}
    render();
    probeNet();
  })();
})();
</script>
</body>
